.staticrypt-page{width:100%;max-width:420px;margin:auto;padding:40px 16px;box-sizing:border-box}
.staticrypt-form{background:#fff;border-radius:16px;padding:36px 32px 28px;text-align:left;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.tk-brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.tk-logo{width:38px;height:38px;border-radius:50%;background:#3B63D9;display:grid;place-items:center}
.tk-word{font-size:24px;font-weight:700;color:#3B63D9;letter-spacing:-.01em}
.staticrypt-instructions{margin:0 0 20px}
.staticrypt-title{font-size:22px;font-weight:700;margin:0 0 6px;color:#0F1B3D}
.staticrypt-instructions p:not(.staticrypt-title){margin:0;color:#4A5675;font-size:15px;line-height:1.45}
.staticrypt-hr{display:none}
.staticrypt-password-container{position:relative;background:#F6F8FC;border:1.5px solid #D9E0EF;border-radius:10px;margin:0 0 14px}
.staticrypt-password-container:focus-within{border-color:#3B63D9;box-shadow:0 0 0 3px rgba(59,99,217,.18)}
.staticrypt-form input[type="password"],input[type="text"]{background:transparent;border:0;box-sizing:border-box;font-size:16px;outline:0;padding:14px 44px 14px 14px;width:100%;color:#0F1B3D;font-family:inherit}
.staticrypt-toggle-password-visibility{cursor:pointer;height:18px;opacity:.5;padding:13px;position:absolute;right:0;top:50%;transform:translateY(-50%);width:18px}
label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:14px;color:#4A5675}
.staticrypt-remember input[type="checkbox"]{width:18px;height:18px;accent-color:#3B63D9;margin:0}
.staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:10px;padding:14px;background:#3B63D9;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.staticrypt-form .staticrypt-decrypt-button:hover,.staticrypt-form .staticrypt-decrypt-button:focus{background:#2F52BD;outline:0;box-shadow:0 0 0 3px rgba(59,99,217,.3)}
.tk-foot{margin-top:18px;font-size:12px;color:#7A86A6;text-align:center}
.tk-under{text-align:center;color:rgba(255,255,255,.55);font-size:12px;margin-top:18px}
.hidden{display:none!important}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:#0F1B3D}
.staticrypt-spinner{display:inline-block;width:2rem;height:2rem;border:.25em solid #3B63D9;border-right-color:transparent;border-radius:50%;animation:spinner-border .75s linear infinite}
@keyframes spinner-border{100%{transform:rotate(360deg)}}
</style>
