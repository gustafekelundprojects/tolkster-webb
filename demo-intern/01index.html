function exampleContact(org,seed=0){
 const people=[['Anna','Lind'],['Johan','Berg'],['Sara','Ek'],['Erik','Lund'],['Maria','Dahl'],['David','Holm'],['Emma','Björk'],['Oskar','Nyström']];
 const n=Number(String(seed).replace(/\D/g,''))||0;
 const [first,last]=people[n%people.length];
 const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'exempel';
 return {contactName:first+' '+last,email:slug(first)+'.'+slug(last)+'+'+n+'@'+slug(org)+'.example',emailVerified:false,contactSource:'Fiktiv kontakt för simulering',isExample:true};
}
function contactLabel(r){return r.contactName||'Kontakt saknas'}
function contactKey(r){return r.contactId||(r.email?'email:'+String(r.email).trim().toLowerCase():r.id)}

 launch(i,task,market,limit=3,customerSegment='small'){const s=this.stages[i];s.task=task;s.market=market;const n=Math.max(1,Math.min(10,Number(limit)||3));for(let j=0;j<n;j++){const r=this.makeRecord('Nytt exempeluppdrag '+(this.counter+1),i);r.country=market==='Alla marknader'?'Sverige':market;r.signal=task;r.customerSegment=customerSegment;r.origin='Manuellt startad demokörning';s.records.push(r)}this.log('Nytt uppdrag i '+s.name,n+' simulerade ärenden lades i kön.');return n}

 event(r,type,route='demo'){if(!['mail.sent','reply.received','link.used','demo.opened','human.requested'].includes(type))throw Error('Okänd händelse.');if(type==='mail.sent'&&!this.drafts[contactKey(r)]?.approved)throw Error('Mejlet behöver godkännas först.');const event={id:'EV-'+salesHash(contactKey(r)+type+Date.now()+this.events.length),contactId:contactKey(r),type,route,at:new Date().toISOString(),example:true,verified:false};this.events.push(event);return event}
 snapshot(){return {version:1,master:this.master,crm:this.crm,confirmed:this.confirmed,jobs:this.jobs,events:this.events,drafts:this.drafts,rules:this.rules}}
 restore(raw){if(!raw||raw.version!==1||!Array.isArray(raw.master)||raw.master.length>15000)throw Error('Ogiltigt sparat underlag.');for(const o of raw.master)if(!o.id||!o.name||!o.market)throw Error('Organisation saknar identifierare.');this.master=raw.master;this.crm=raw.crm||null;this.confirmed=raw.confirmed||{};this.jobs=raw.jobs||[];this.events=raw.events||[];this.drafts=raw.drafts||{};this.rules={jobsPerRun:Math.max(1,Math.min(10,Number(raw.rules?.jobsPerRun)||3)),maxAttempts:Math.max(1,Math.min(3,Number(raw.rules?.maxAttempts)||2))}}
}

function commandForm(stage=null){const i=stage===null?0:stage,s=motor.stages[i];return `<section class="command"><h2>${stage===null?'Starta ett uppdrag':'Uppdrag till agenten'}</h2><p>${stage===null?'Välj arbetsstation och ge agenten ett tydligt uppdrag.':'Styr vad agenten ska göra i just det här steget.'}</p><label class="sr" for="task-input">Uppdrag</label><textarea id="task-input">${esc(s.task)}</textarea><div class="command-row">${stage===null?`<label class="sr" for="launch-stage">Arbetsstation</label><select id="launch-stage" onchange="updateCommand(this.value)">${motor.stages.map((x,j)=>`<option value="${j}">0${j+1} ${x.name}</option>`).join('')}</select>`:`<input id="launch-stage" type="hidden" value="${i}">`}<label class="sr" for="launch-market">Marknad</label><select id="launch-market">${['Sverige','Danmark','Finland','Norge','Nederländerna','Tyskland','Storbritannien','USA','Alla marknader'].map(x=>`<option ${x===s.market?'selected':''}>${x}</option>`).join('')}</select><label class="sr" for="launch-segment">Kundsegment</label><select id="launch-segment"><option value="small">Småkund – automatiskt</option><option value="medium">Mellankund – kräver OK</option><option value="large">Stor / strategisk – tidigt OK</option></select><label class="sr" for="launch-limit">Antal exempelärenden</label><select id="launch-limit"><option value="3">3 exempelärenden</option><option value="5">5 exempelärenden</option><option value="10">10 exempelärenden</option></select><button class="primary" onclick="launchTask()">Starta körning →</button></div></section>`}

function renderStage(i){const s=motor.stages[i],rows=s.records.filter(r=>filter==='all'?!['forwarded','rejected'].includes(r.status):filter==='stopped'?['held','closed','blocked'].includes(r.status):r.status===filter);return `<div class="intro"><div><div class="eyebrow">Arbetsstation 0${i+1} · ${s.tag}</div><h1>${s.name}</h1><p>${descriptions[i]} Steget arbetar självständigt även när andra steg är pausade.</p></div><button onclick="openSettings(${i})">Agentinställningar</button></div><section class="detail-controls"><div class="detail-control-row">${stageBadge(s)}<label class="pace-label" for="detail-pace">Arbetstakt <span id="pace-value-${i}">${s.pace}%</span></label><input id="detail-pace" type="range" min="0" max="100" step="5" value="${s.pace}" oninput="setPace(${i},this.value,false)" onchange="render()"><button onclick="adjustPace(${i},20)">+ Gasa</button><button onclick="adjustPace(${i},-20)">− Bromsa</button><button onclick="pauseStage(${i})">${s.paused?'▶ Återuppta':'Ⅱ Pausa'}</button></div><div class="detail-mode"><span>${esc(s.agent)}</span><label for="handoff-mode">Överlämning</label><select id="handoff-mode" onchange="setAuto(${i},this.value)"><option value="manual" ${!s.auto?'selected':''}>Manuell</option><option value="auto" ${s.auto?'selected':''}>Segmentstyrd – tillåt automatik</option></select></div>${i===2?'<p class="small" style="margin:12px 0 0">Småkunder går automatiskt enligt godkänt upplägg. Mellan- och storkunder kräver ett godkännande före Outreach. Inga mejl skickas i skissen.</p>':''}</section>${commandForm(i)}<div class="queue-toolbar"><h2 class="section-title">Arbetskö</h2><div class="tabs">${[['all','Alla'],['waiting','I kö'],['working','Pågår'],['ready','Klart'],['review','Granska'],['stopped','Stoppade']].map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}</div></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="Markera alla färdiga och granskningsbara ärenden" onchange="selectAll(this.checked,${i})"></th><th>Organisation</th><th>Signal / underlag</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" aria-label="Välj ${esc(r.org)}" ${selected.has(r.id)?'checked':''} ${!['ready','review'].includes(r.status)?'disabled':''} onchange="selectRecord('${r.id}',this.checked)"></td><td><b>${esc(r.org)}</b><small>${esc(r.country)} · ${esc(r.role)}</small><small style="color:#315dbd">${segmentLabels[r.customerSegment]}</small></td><td><small style="max-width:230px">${esc(r.signal).slice(0,90)}</small></td><td><span class="record-state ${r.status}">${statuses[r.status]}</span>${!fleet.registry.decision(r).allowed?'<small>'+esc(fleet.registry.decision(r).reason)+'</small>':''}</td><td><button class="table-action" onclick="showRecord(${i},'${r.id}')">Visa →</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Inga ärenden i den här vyn.</div></td></tr>'}</tbody></table></div><div class="handoff"><label id="selection-count">${selected.size} valda</label><label for="handoff-target" class="sr">Mottagande arbetsstation</label><select id="handoff-target">${[0,1,2,3,4].filter(x=>x!==i).map(x=>`<option value="${x}" ${x===i+1?'selected':''}>${x===4?'05 Demo':'0'+(x+1)+' '+motor.stages[x].name}</option>`).join('')}</select><button id="handoff-button" class="primary" onclick="sendSelected(${i})" ${!selected.size?'disabled':''}>Godkänn & skicka vidare →</button></div><p class="small">Mottagande steg kvitterar ärendet. Är steget pausat väntar ärendet i dess kö. Allt här är simulerat.</p>`}

 $('record-detail').innerHTML=`<div class="eyebrow">${r.id} · exempelärende</div><h2>${esc(r.org)}</h2><p>${esc(r.signal)}</p><div class="brief-grid"><div><small>Land</small>${esc(r.country)}</div><div><small>Roll</small>${esc(r.role)}</div><div><small>Status</small>${statuses[r.status]}</div><div><small>Underlag</small>${esc(r.origin)}</div></div>${isEmail?'<div class="eyebrow" style="margin:15px 0 10px">Simulerat mejlutkast</div><div class="mock-mail">'+esc(mail)+'</div>':`<p><b>Agentens nästa åtgärd:</b> ${i===0?'Kontrollera signal och roll, spara källa och skilj fakta från antaganden.':i===1?'Matcha mot organisation och kontakt i Attio, granska dubbletter och föreslå ansvarig.':'Granska arbetsdomän och tillgång. Förbered organisation, språk och kundkontext för Demo.'}</p>`}<label class="small" for="record-segment">Kundsegment i skissen</label><div class="command-row"><select id="record-segment" onchange="changeRecordSegment(${i},'${id}',this.value)">${Object.entries(segmentLabels).map(([key,label])=>`<option value="${key}" ${key===r.customerSegment?'selected':''}>${label}</option>`).join('')}</select></div>${r.exception?'<p class="small">Undantag: '+esc(r.exception)+'. Kräver manuell bedömning.</p>':''}<p class="small">Detta är ett simulerat ärende. Inga verkliga källor, domänkontroller eller externa åtgärder har körts.</p><div class="dialog-actions">${r.status==='review'?`<button class="primary" onclick="approveRecord(${i},'${id}')">Godkänn i skissen</button>`:''}${i===3&&!['forwarded','rejected'].includes(r.status)?`<button onclick="rejectRecord(${i},'${id}')">Avvisa i skissen</button>`:''}<button onclick="document.getElementById('record-dialog').close()">Stäng</button></div>`;if(!$('record-dialog').open)$('record-dialog').showModal()}

function renderMarkets(){
 const running=MARKET_PROFILES.filter(p=>fleet[p.id].running).length;
 return `<div class="intro"><div><div class="eyebrow">01 MOTOR · välj marknad</div><h1>Marknad för marknad.</h1><p>Öppna ett land. Där väljer du vilka organisationer och roller agenterna ska hitta, och styr landets egen kedja 01–04.</p></div><span class="sim-note">Klickbar skiss · inga riktiga sökningar</span></div><div class="market-explainer"><b>Så börjar du:</b> välj exempelvis Danmark → ställ in målgrupp → starta research → granska fynd eller låt segmentreglerna föra dem vidare.</div><div class="market-summary"><span><b>8</b> marknader</span><span><b>${running}</b> kör simulering</span><span><b>4</b> egna steg per marknad</span></div><div class="market-grid">${MARKET_PROFILES.map(p=>{const m=fleet[p.id],c=marketTotals(m);return `<section class="market-card"><div class="market-card-head"><span class="big-flag">${p.flag}</span><div><h2>${p.name}</h2><small>${p.language} · ${m.config.channel}</small></div><span class="status ${m.running?'':'paused'}">${m.running?'Kör':'Redo'}</span></div><div class="country-pipeline">${m.stages.map((s,i)=>`<span title="${s.name}"><b>0${i+1}</b> ${s.paused?'Pausad':m.counts(i).waiting+motorCountActive(m,i)+' i kö / pågår'}</span>`).join('')}</div><div class="market-kpis"><span>${c.ready} klara</span><span>${c.review} behöver OK</span></div><div class="market-actions"><button class="primary" onclick="openMarket('${p.id}')">Öppna ${p.name} →</button><button onclick="toggleCountry('${p.id}')" aria-label="${m.running?'Pausa':'Starta'} ${p.name}">${m.running?'Ⅱ Pausa':'▶ Starta'}</button></div></section>`}).join('')}</div>`;
}
function motorCountActive(m,i){return m.counts(i).working}
function renderMarketHome(){const p=marketProfile();return `<div class="intro"><div><div class="eyebrow">01 MOTOR · ${p.flag} ${p.name}</div><h1>${p.name}</h1><p>Egna agenter, egna uppdrag och en egen kö i varje steg. Inställningar här påverkar bara ${p.name}.</p></div><button onclick="navigate('markets')">Alla marknader</button></div><div class="country-control"><span class="status ${motor.running?'':'paused'}">${motor.running?'Simulering pågår':'Redo att starta'}</span><span>${esc(p.language)} · ${esc(motor.config.channel)}</span><button onclick="adjustMarketPace('${p.id}',20)">+ Gasa landet</button><button onclick="adjustMarketPace('${p.id}',-20)">− Bromsa landet</button><button onclick="toggleCountry('${p.id}')">${motor.running?'Ⅱ Pausa landet':'▶ Starta landet'}</button></div><div class="pipeline-four">${motor.stages.map((s,i)=>{const c=motor.counts(i);return `<button onclick="navigate('${i}')"><small>0${i+1} ${s.name}</small><b>${c.waiting+c.working}</b><span>${s.paused?'Pausat':c.review?c.review+' kräver OK':c.ready+' klara'}</span></button>`}).join('')}</div>${researchForm()}<div class="queue-toolbar"><h2 class="section-title">${p.name} · senaste exempel på fynd</h2><button class="table-action" onclick="navigate('0')">Öppna researchkön →</button></div><div class="market-findings">${motor.stages[0].records.filter(r=>r.status!=='forwarded').slice(0,4).map(r=>`<button onclick="showRecord(0,'${r.id}')"><b>${esc(r.org)}</b><span>${esc(r.role)}</span><small>${segmentLabels[r.customerSegment]} · ${statuses[r.status]}</small></button>`).join('')||'<div class="empty">Kön är tom. Starta ett nytt researchuppdrag ovan.</div>'}</div>`}
function researchForm(){const p=marketProfile(),c=motor.config;return `<section class="command research-form"><div class="eyebrow">01 Intelligence · ${p.name}</div><h2>Vilka köpare ska agenten hitta i ${p.name}?</h2><p>Konfigurera landets researchagent. Både rollbaserad sökning och köpsignaler kan användas.</p><div class="research-grid"><label>Typ av organisation<select id="research-org" onchange="saveMarketField('orgType',this.value)">${['Kommun / stad','Region / vård','Myndighet','Privat organisation','Tolkförmedling'].map(x=>`<option ${x===c.orgType?'selected':''}>${x}</option>`).join('')}</select></label><label>Verksamhet<select id="research-domain" onchange="saveMarketField('domain',this.value)">${['Arbetsmarknad & integration','Socialtjänst','Skola & utbildning','Vård & omsorg','Kommunövergripande'].map(x=>`<option ${x===c.domain?'selected':''}>${x}</option>`).join('')}</select></label><label>Sök efter<select id="research-mode" onchange="saveMarketField('mode',this.value)"><option value="both" ${c.mode==='both'?'selected':''}>Roller och köpsignaler</option><option value="roles" ${c.mode==='roles'?'selected':''}>Rätt roller, oavsett signal</option><option value="signals" ${c.mode==='signals'?'selected':''}>Organisationer med köpsignal</option></select></label><label>Kundsegment<select id="research-segment" onchange="saveMarketField('customerSegment',this.value)">${Object.entries(segmentLabels).map(([k,l])=>`<option value="${k}" ${c.customerSegment===k?'selected':''}>${l}</option>`).join('')}</select></label><label class="full">Roller att hitta<input id="research-roles" value="${esc(c.roles)}" oninput="saveMarketField('roles',this.value)" placeholder="Exempelvis verksamhetschef, projektledare, inköp"></label><label class="full">Signaler att leta efter<input id="research-signals" value="${esc(c.signals)}" oninput="saveMarketField('signals',this.value)" placeholder="Exempelvis AI-projekt, upphandling, språkbehov"></label>${['US','UK','DE'].includes(p.id)?`<label class="full">${p.id==='US'?'Delstat / område':p.id==='UK'?'Nation / område':'Delstat / område'} (valfritt)<input value="${esc(c.region)}" oninput="saveMarketField('region',this.value)" placeholder="Avgränsa inom ${p.name}"></label>`:''}<label>Försäljningskanal<select onchange="saveMarketField('channel',this.value)">${['Direkt','Partner','Båda'].map(x=>`<option ${c.channel===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Omfattning i denna demo<select id="research-limit" onchange="saveMarketField('limit',Number(this.value))">${[3,5,10].map(n=>`<option value="${n}" ${n===Number(c.limit)?'selected':''}>${n} exempelärenden</option>`).join('')}</select></label></div><fieldset class="source-options"><legend>Källor att söka i</legend>${['Officiella organisationswebbplatser','Offentliga beslut','Upphandlingsportaler','Inkommande signaler'].map(x=>`<label><input type="checkbox" value="${x}" ${c.sources.includes(x)?'checked':''} onchange="saveMarketSources()">${x}</label>`).join('')}</fieldset><label class="research-task-label" for="research-task">Agentens uppdrag</label><textarea id="research-task" oninput="motor.stages[0].task=this.value">${esc(motor.stages[0].task)}</textarea><div class="research-launch"><span>Små automatiskt · mellan OK före 03 · stora tidigt OK</span><button class="primary" onclick="launchResearch()">Starta research i ${p.name} →</button></div><p class="small" style="margin:10px 0 0">Simuleringen skapar exempelärenden med dina inställningar. Den gör inga verkliga webbsökningar.</p></section>`}
function saveMarketField(key,value){motor.config[key]=value;renderSide()}
function saveMarketSources(){motor.config.sources=[...document.querySelectorAll('.source-options input:checked')].map(x=>x.value);renderSide()}
function launchResearch(){const p=marketProfile(),c=motor.config,task=$('research-task').value.trim();if(!task){notify('Beskriv uppdraget först.');return}if(!c.sources.length){notify('Välj minst en typ av källa.');return}const before=motor.stages[0].records.length;const count=motor.launch(0,task,p.name,c.limit,c.customerSegment);const jobs=motor.stages[0].records.slice(before);jobs.forEach(r=>{r.id=p.id+'-'+r.id;r.customer=r.id;r.role=c.roles;r.org=c.orgType+' · exempel '+p.id+' '+r.id.split('-').at(-1);r.researchSpec={market:p.id,...c,sources:[...c.sources]};r.signal=c.mode==='roles'?'Rollbaserat uppdrag: '+c.roles:'Signalbaserat uppdrag: '+c.signals});motor.running=true;motor.log('Research startad i '+p.name,c.orgType+' · '+c.domain+' · '+count+' exempelärenden.');navigate('0');notify('Researchsimulering startad i '+p.name+'. Övriga marknader påverkas inte.')}
const legacyCommandForm=commandForm;
commandForm=function(stage=null){if(stage===null||stage===0)return researchForm();let html=legacyCommandForm(stage);const start=html.indexOf('<label class="sr" for="launch-market">'),end=html.indexOf('<label class="sr" for="launch-segment">');if(start>=0&&end>start)html=html.slice(0,start)+`<input id="launch-market" type="hidden" value="${esc(marketProfile().name)}"><span class="market-fixed">${marketProfile().flag} ${marketProfile().name}</span>`+html.slice(end);return html};
function launchTask(){const task=$('task-input').value.trim();if(!task){notify('Skriv ett uppdrag först.');return}const i=Number($('launch-stage').value),n=Number($('launch-limit').value);const before=motor.stages[i].records.length;motor.launch(i,task,marketProfile().name,n,$('launch-segment').value);motor.stages[i].records.slice(before).forEach(r=>{r.country=marketProfile().name;r.customer=activeMarket+'-'+r.customer;r.researchSpec={market:activeMarket,...motor.config,sources:[...motor.config.sources]}});render();notify(n+' exempelärenden lades i '+marketProfile().name+' · '+motor.stages[i].name+'.')}
function toggleCountry(code){const m=fleet[code];m.running=!m.running;m.log(m.running?'Marknaden startad':'Marknaden pausad',m.market.name+' · andra marknader påverkas inte.');render()}
function adjustMarketPace(code,delta){for(let i=0;i<4;i++)fleet[code].setPace(i,fleet[code].stages[i].pace+delta);fleet[code].log('Landets takt ändrad',fleet[code].market.name+' · '+(delta>0?'ökad':'sänkt')+' takt i steg 01–04.');render();notify(fleet[code].market.name+': takten är '+(delta>0?'höjd.':'sänkt.'))}
function toggleSimulation(){if(activeMarket){toggleCountry(activeMarket);return}const any=Object.values(fleet).some(m=>m.running);for(const m of Object.values(fleet)){m.running=!any;m.log(!any?'Marknaden startad':'Marknaden pausad','Gemensamt kommando till alla marknader.')}render()}
function renderSide(){
 const market=activeMarket?marketProfile():null;
 if(!market){$('selection-panel').innerHTML=`<div class="eyebrow">Börja med ett land</div><h2>Varje marknad har en egen motor.</h2><p>Sverige, Danmark och övriga marknader får egna agentinställningar och fyra egna köer. Du kan starta ett land och pausa ett annat.</p><p><b>Välj en marknad till vänster eller i översikten.</b></p><p class="small">Alla siffror och fynd är exempeldata. Inga externa agenter eller system är anslutna.</p>`}else{const c=motor.config;$('selection-panel').innerHTML=`<div class="eyebrow">${market.flag} ${market.name}</div><h2>Landets researchprofil</h2><p><b>Målgrupp:</b> ${esc(c.orgType)}<br><b>Verksamhet:</b> ${esc(c.domain)}<br><b>Språk:</b> ${esc(market.language)}<br><b>Kanal:</b> ${esc(c.channel)}</p><p><b>Roller:</b> ${esc(c.roles)}</p><p><b>Källor:</b> ${c.sources.length} valda typer</p><span class="pill">Bara ${market.name} påverkas här</span><p class="small">Små: automatiskt. Mellan: OK före 03. Stora: tidigt OK. Oklarheter kräver granskning.</p>`}
 const events=activeMarket?motor.events:Object.values(fleet).flatMap(m=>m.events.map(e=>({...e,title:m.market.name+' · '+e.title}))).sort((a,b)=>b.time-a.time);
 $('events').innerHTML=events.slice(0,5).map(e=>`<article class="event"><b>${esc(e.title)}</b><p>${esc(e.detail)}</p><time>${new Date(e.time).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}</time></article>`).join('');
 const running=Object.values(fleet).filter(m=>m.running).length;
 $('run-label').textContent=activeMarket?(motor.running?market.name+' · simulering pågår':market.name+' · redo att starta'):running+' av 8 marknader kör simulering';
 $('run-dot').classList.toggle('live',activeMarket?motor.running:running>0);
 $('simulation-button').textContent=activeMarket?(motor.running?'Ⅱ Pausa '+market.name:'▶ Starta '+market.name):(running?'Ⅱ Pausa alla marknader':'▶ Starta alla marknader');
}
const legacyRenderStage=renderStage;
renderStage=function(i){return legacyRenderStage(i).replace(`<h1>${motor.stages[i].name}</h1>`,`<h1>${marketProfile().name} · ${i===0?'hitta köpare':motor.stages[i].name}</h1>`).replace('Arbetsstation 0'+(i+1)+' ·',marketProfile().name+' · arbetsstation 0'+(i+1)+' ·')};
function render(){renderNav();$('workspace').innerHTML=view==='markets'?renderMarkets():view==='overview'?renderMarketHome():view==='runs'?renderRuns():renderStage(Number(view));renderSide()}
function resetDemo(){fleet=createMarketFleet();motor=fleet[activeMarket||'SE'];selected.clear();filter='all';render();notify('Alla marknaders exempeldata är återställda.')}
setInterval(()=>{if(!Object.values(fleet).some(m=>m.running))return;fleet.registry.sync(fleet);Object.values(fleet).forEach(m=>m.tick());fleet.registry.sync(fleet);const active=document.activeElement;const editing=active&&['TEXTAREA','INPUT','SELECT'].includes(active.tagName);if(editing||$('record-dialog').open||$('settings-dialog').open)renderSide();else render()},1200);

const MOTOR_DEMO_URL='index.html';
function demoContextFor(record){
 const spec=record.researchSpec||motor.config;const profile=motor.market;
 return {version:1,example:true,customerId:record.customer,contactId:record.contactId||contactKey(record),contactName:record.contactName||'',email:record.email||'',organisation:record.org,country:profile.name,market:profile.id,language:profile.language,role:record.role||'Inbjuden besökare',orgType:spec.orgType||'',domain:spec.domain||'',segment:record.customerSegment||'unknown',channel:spec.channel||'Direkt',region:spec.region||'',sources:spec.sources||[],origin:'Tolkster Motor · intern simulering'};
}
function demoHref(record){return MOTOR_DEMO_URL+'#motor='+encodeURIComponent(JSON.stringify(demoContextFor(record)))}
function deliveredBlock(){if(!motor.delivered.length)return '';return `<section class="command"><div class="eyebrow">04 Access → 05 Demo</div><h2>${motor.delivered.length} kunddemo${motor.delivered.length===1?' är':'s är'} förberedd${motor.delivered.length===1?'':'a'}</h2><p>Organisation, marknad, verksamhet, roll och segment följer med till respektive Demo.</p><div class="market-findings">${motor.delivered.slice(-5).reverse().map(r=>!fleet.registry.decision(r).allowed?`<div class="delivery-link"><div><b>${esc(r.org)}</b><small>${esc(fleet.registry.decision(r).reason)}</small></div><span>Stoppad i prototypen</span></div>`:`<a class="delivery-link" href="${esc(demoHref(r))}" target="_blank" rel="noopener"><div><b>${esc(r.org)}</b><small>${esc(motor.market.name)} · ${esc((r.researchSpec||{}).domain||'Verksamhet att bekräfta')}</small></div><span>Öppna kundens Demo ↗</span></a>`).join('')}</div></section>`}
function renderDemos(){return `<div class="intro"><div><div class="eyebrow">${motor.market.name} · steg 05</div><h1>Kundernas Demo.</h1><p>Här finns de organisationer som har lämnats vidare från Access. Varje länk öppnar Demo med organisationens egen exempelkontext.</p></div></div>${deliveredBlock()||'<div class="empty"><p>Ingen organisation har lämnats vidare ännu.</p><button class="primary" onclick="navigate(\'3\')">Öppna 04 Access →</button></div>'}`}
const marketHomeBeforeDemo=renderMarketHome;
renderMarketHome=function(){return marketHomeBeforeDemo()+deliveredBlock()};
const stageBeforeDemo=renderStage;
renderStage=function(i){return stageBeforeDemo(i)+(i===3?deliveredBlock():'')};
const recordBeforeContext=showRecord;
showRecord=function(i,id){recordBeforeContext(i,id);const r=motor.stages[i].records.find(x=>x.id===id);if(!r)return;const spec=r.researchSpec||motor.config;
 const context=`<section class="record-context"><div class="eyebrow">Gemensam kundkontext · följer med genom 01–05</div><div class="brief-grid"><div><small>Organisationstyp</small>${esc(spec.orgType||'Att bekräfta')}</div><div><small>Verksamhet</small>${esc(spec.domain||'Att bekräfta')}</div><div><small>Marknad / kanal</small>${esc(motor.market.name)} · ${esc(spec.channel||'Direkt')}</div><div><small>Kund-ID</small>${esc(r.customer)}</div></div><p class="small">${['01 Research: målgrupp och källor följer med.','02 Attio: föreslagen matchning, ingen riktig CRM-ändring.','03 Outreach: exempeltext utifrån organisation och verksamhet.','04 Access: Demo-kontext förbereds; verklig inloggning är inte ansluten.'][i]}</p>${r.trail.length?'<p class="small">Överlämningar: '+r.trail.map(t=>'0'+(t.from+1)+' → 0'+(t.to+1)).join(' · ')+'</p>':''}</section>`;
 $('record-detail').insertAdjacentHTML('beforeend',context);
 if(i===2){const box=$('record-detail').querySelector('.mock-mail');if(box)box.textContent='Ämne: Språkstöd för '+r.org+'\n\nHej,\n\nVi vill gärna visa hur Tolkster skulle kunna hjälpa '+r.org+' inom '+(spec.domain||'er verksamhet').toLowerCase()+'. Utforska lösningen, ställ frågor och prova upplägget i er egen takt.\n\nEn personlig Demo-länk förbereds i Access. Vill ni hellre prata direkt finns Henrik till hands.\n\nVänliga hälsningar\nTolkster\n\n[Simulerat utkast på svenska. Avsett språk: '+motor.market.language+'. Ingen e-post skickas.]';}
};
const navBeforeDemo=renderNav;
renderNav=function(){navBeforeDemo();if(activeMarket){const nav=$('navigation');const target=[...nav.querySelectorAll('.nav-item')].find(x=>x.textContent.includes('Körningar'));if(target)target.insertAdjacentHTML('afterend',`<button class="nav-item ${view==='demos'?'active':''}" onclick="navigate('demos')"><span class="num">05</span>Kunddemos</button>`);}}
function render(){renderNav();$('workspace').innerHTML=view==='markets'?renderMarkets():view==='overview'?renderMarketHome():view==='runs'?renderRuns():view==='demos'?renderDemos():renderStage(Number(view));renderSide()}


function lifecycleDate(days=0){const d=new Date();d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const detailBeforeLifecycle=showRecord;
showRecord=function(i,id){fleet.registry.sync(fleet);detailBeforeLifecycle(i,id);const r=motor.stages[i].records.find(x=>x.id===id);if(!r)return;const state=fleet.registry.decision(r);
 $('record-detail').insertAdjacentHTML('beforeend',`<section class="record-context"><div class="eyebrow">Gemensam status · gäller även vid nya signaler</div><h3>${state.allowed?'Aktiv bearbetning':esc(({paused:'Parkerad',disqualified:'Avslutad',blocked:'Kontaktspärr'}[state.status]))}</h3><p class="small">${state.allowed?'Attio och steg 01–05 ska använda samma kundstatus. I skissen matchas organisation på namn och marknad.':esc(state.reason)+(state.until?' · till '+esc(state.until):'')}</p><div class="settings-grid"><label>Vad ska beslutet gälla?<select id="lifecycle-scope"><option value="opportunity">Denna affär / verksamhet</option><option value="organisation">Hela organisationen</option><option value="contact">Denna kontakt</option></select></label><label>Orsak<select id="lifecycle-reason"><option>Inte aktuell just nu</option><option>Utanför målgruppen</option><option>Ingen budget just nu</option><option>Fel kontakt</option><option>Misstänkt konkurrent – manuell bedömning</option><option>Avregistrering / kontaktstopp</option><option>Manuellt beslut efter granskning</option></select></label><label>Pausa till<input id="lifecycle-until" type="date" min="${lifecycleDate()}" value="${lifecycleDate(30)}"></label></div><div class="dialog-actions"><button onclick="applyLeadState(${i},'${id}','active')">Fortsätt</button><button onclick="applyLeadState(${i},'${id}','paused')">Pausa till datum</button><button onclick="applyLeadState(${i},'${id}','disqualified')">Avsluta bearbetning</button><button onclick="applyLeadState(${i},'${id}','blocked')">Spärra kontakt</button></div><p class="small">Kontaktspärr gäller bara denna kontakt. Ett nej från en person stänger inte automatiskt hela organisationen. Historiken behålls, så nya fynd inte återstartar bearbetningen.</p><button class="table-action" onclick="returnToResearch(${i},'${id}')">${i===0?'Simulera ny signal via Attio':'Be 01 komplettera · återkopplingsloop'} →</button><p class="small">Statuskontrollen stoppar väntande arbete och Demo-länken i Motor. Den kan inte återkalla en redan öppnad statisk Demo eller tidigare skickad e-post. Riktig spärrning kräver backend.</p></section>`);
};
function applyLeadState(i,id,status){const r=motor.stages[i].records.find(x=>x.id===id);if(!r)return;const scope=status==='blocked'?'contact':$('lifecycle-scope').value,reason=$('lifecycle-reason').value,until=status==='paused'?$('lifecycle-until').value:null;if(status==='paused'&&(!until||until<lifecycleDate())){notify('Välj ett datum som är i dag eller senare.');return;}fleet.registry.set(r,scope,status,reason,until);fleet.registry.sync(fleet);motor.log('Gemensam kundstatus uppdaterad',r.org+' · '+({active:'fortsätt',paused:'parkerad',disqualified:'avslutad bearbetning',blocked:'kontaktspärr'}[status])+' · '+reason);render();showRecord(i,id);notify('Beslutet gäller i alla steg. Historiken finns kvar.')}
function returnToResearch(i,id){const r=motor.stages[i].records.find(x=>x.id===id);if(!r)return;const result=fleet.registry.requestEnrichment(motor,r,i===0?1:i);fleet.registry.sync(fleet);render();showRecord(i,id);notify(result.message)}
render();

// A small default surface; detailed queues and controls remain available on demand.
const simpleDisclosure={};
function simpleOptions(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function simpleReviewItems(code=null){return Object.values(fleet).filter(m=>!code||m.market.id===code).flatMap(m=>m.stages.flatMap((s,i)=>s.records.filter(r=>r.status==='review'&&fleet.registry.decision(r).allowed).map(r=>({m,i,r}))))}
function simpleOpenRecord(code,i,id){activeMarket=code;motor=fleet[code];showRecord(i,id)}
function simpleSetTarget(key,value){motor.config[key]=value;renderSide()}
function simpleToggleDisclosure(key,open){simpleDisclosure[key]=open}
function simpleRows(items){return items.map(({m,i,r})=>`<button class="simple-record" onclick="simpleOpenRecord('${m.market.id}',${i},'${r.id}')"><span><b>${esc(r.org)}</b><small>${esc(m.market.name)} · 0${i+1} ${esc(m.stages[i].name)}</small></span><span>${r.exception?esc(r.exception):esc(segmentLabels[r.customerSegment]||'Behöver bedömas')} <span aria-hidden="true">→</span></span></button>`).join('')}
renderNav=function(){
 const count=simpleReviewItems().length;

// Contact-first default: one list, one start action, and the person's next step.
function contactRecords(code=null){
 const byPerson=new Map();
 for(const m of Object.values(fleet).filter(m=>!code||m.market.id===code))for(const [i,records] of [...m.stages.map((s,i)=>[i,s.records]),[4,m.delivered]])for(const r of records){
  if(r.enrichmentOnly)continue;
  const key=contactKey(r),old=byPerson.get(key);
  if(!old||i>=old.i)byPerson.set(key,{m,i,r});
 }
 return [...byPerson.values()];
}
function contactStatus(i,r){
 const state=fleet.registry.decision(r);
 if(!state.allowed)return {text:({paused:'Pausad',blocked:'Kontaktspärr',disqualified:'Avslutad'}[state.status])||'Stoppad',kind:'stopped'};
 if(r.status==='rejected')return {text:'Avvisad',kind:'stopped'};
 if(r.status==='review')return {text:'Behöver OK',kind:'review'};
 if(i===4)return {text:'Demo-inbjudan redo',kind:'ready'};
 return {text:['Hittad','Till Attio','Kontaktas','Demo förbereds'][i],kind:'normal'};
}
function contactTable(items){return `<div class="contact-table-wrap"><table class="contact-table"><thead><tr><th>Person</th><th>E-post</th><th>Organisation</th><th>Steg</th></tr></thead><tbody>${items.map(({m,i,r})=>{const s=contactStatus(i,r);return `<tr><td data-label="Person"><button class="contact-open" onclick="contactOpen('${m.market.id}',${i},'${r.id}')">${esc(contactLabel(r))}</button><small>${esc(r.role)}</small></td><td data-label="E-post"><span class="contact-email">${esc(r.email||'Saknas – behöver hittas')}</span></td><td data-label="Organisation">${esc(r.org)}</td><td data-label="Steg"><span class="contact-state ${s.kind}">${esc(s.text)}</span></td></tr>`}).join('')||'<tr><td colspan="4"><div class="empty">Inga kontakter ännu. Välj Hitta kontakter för att börja.</div></td></tr>'}</tbody></table></div>`}

launchResearch=function(){
 const p=marketProfile(),c=motor.config,task=$('research-task').value.trim();
 if(!task){notify('Beskriv uppdraget under Finjustera uppdraget.');return}
 if(!c.sources.length){notify('Välj minst en källa under Finjustera uppdraget.');return}
 const before=motor.stages[0].records.length,count=motor.launch(0,task,p.name,c.limit,c.customerSegment),roles=c.roles.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
 motor.stages[0].records.slice(before).forEach((r,j)=>{r.id=p.id+'-'+r.id;r.customer=r.id;r.role=roles[j%roles.length]||'Ansvarig roll att bekräfta';r.org=c.orgType+' · exempel '+p.id+' '+r.id.split('-').at(-1);Object.assign(r,exampleContact(r.org,r.id));r.researchSpec={market:p.id,...c,sources:[...c.sources]};r.signal=c.mode==='roles'?'Relevant roll: '+r.role:'Möjlig signal: '+c.signals;fleet.registry.register(p,r)});
 motor.running=true;motor.log('Kontaktsökning startad i '+p.name,count+' fiktiva kontakter · '+c.orgType+' · '+c.domain+'.');

};

function contactOpen(code,i,id){activeMarket=code;motor=fleet[code];if(i<4){showRecord(i,id);return}const r=motor.delivered.find(x=>x.id===id);if(!r)return;contactDetail(i,r);$('record-dialog').showModal()}

function contactDetail(i,r,extra=null){
 const state=fleet.registry.decision(r),s=contactStatus(i,r),canAdvance=i<4&&['review','ready'].includes(r.status)&&state.allowed;
 const next=['Attio','kontakt','Demo-förberedelse','Demo-inbjudan'][i];
 const action=i===0?'Lägg i Attio':i===1?'Godkänn kontakt':i===2?'Förbered Demo':'Gör inbjudan redo';
 $('record-detail').innerHTML=`<div class="eyebrow">${esc(motor.market.name)} · fiktiv kontakt</div><h2>${esc(contactLabel(r))}</h2><p class="contact-detail-email">${esc(r.email||'Arbetsmejl saknas')}</p><p>${esc(r.role)} · ${esc(r.org)}</p>${contactProgress(i,r)}<span class="contact-state ${s.kind}">${esc(s.text)}</span><p>${esc(r.exception||r.signal)}</p>${i===2?`<div class="mock-mail">Till: ${esc(contactLabel(r))} &lt;${esc(r.email||'Saknas')}&gt;\n\nHej ${esc((r.contactName||'').split(' ')[0])},\n\nVi vill gärna visa hur Tolkster skulle kunna hjälpa ${esc(r.org)} inom ${esc(((r.researchSpec||{}).domain||'er verksamhet').toLowerCase())}. Du kan utforska lösningen i egen takt och välja personlig kontakt när du vill.\n\nVänliga hälsningar,\nTolkster\n\n[Utkast på svenska. Avsett språk: ${esc(motor.market.language)}. Ingen e-post skickas.]</div>`:''}<div class="dialog-actions">${canAdvance?`<button class="primary" onclick="simpleApproveNext(${i},'${r.id}')">${action} →</button>`:''}${i===4&&state.allowed?`<a class="contact-demo-button" href="${esc(MOTOR_DEMO_URL+'#motor='+encodeURIComponent(JSON.stringify(demoContextFor(r))))}" target="_blank" rel="noopener">Öppna ${esc((r.contactName||'kontaktens').split(' ')[0])}s Demo →</a>`:''}<button onclick="document.getElementById('record-dialog').close()">Stäng</button></div><p class="simple-policy">${state.allowed?(i===4?'Personlig inbjudan är förberedd i skissen. Inget mejl har skickats.':canAdvance?'Nästa steg: '+next+'. Åtgärden simuleras.':'Kontakten väntar på bearbetning. Åtgärderna simuleras.'):esc(state.reason)}</p>`;
 if(extra)$('record-detail').append(extra);
}
showRecord=function(i,id){

const SALES_STORE='tolkster.motor.sales.v1';
function salesSave(){try{const machines=Object.fromEntries(Object.entries(fleet).map(([k,m])=>[k,{config:m.config,stages:m.stages,delivered:m.delivered,counter:m.counter,events:m.events}]));const reg=fleet.registry;localStorage.setItem(SALES_STORE,JSON.stringify({engine:sales.snapshot(),machines,registry:{accounts:[...reg.accounts],opportunities:[...reg.opportunities],contacts:[...reg.contacts],accountKeys:[...reg.accountKeys],next:reg.next,audit:reg.audit,enrichment:[...reg.enrichment]}}));salesStorageError=false}catch{salesStorageError=true}}
function salesRestore(){try{const text=localStorage.getItem(SALES_STORE);if(!text)return;const raw=JSON.parse(text);sales.restore(raw.engine);if(raw.machines&&raw.registry){for(const [k,data] of Object.entries(raw.machines)){const m=fleet[k];if(!m||!Array.isArray(data.stages)||data.stages.length!==4)continue;Object.assign(m,data);m.running=false;}for(const key of ['accounts','opportunities','contacts','accountKeys','enrichment'])fleet.registry[key]=new Map(raw.registry[key]||[]);fleet.registry.next=raw.registry.next||0;fleet.registry.audit=raw.registry.audit||[];fleet.registry.sync(fleet)}}catch{salesStorageError=true}}
function salesSelectMarket(code){if(!fleet[code])return;activeMarket=code;motor=fleet[code];salesPage=0;render()}
function salesMarketSelect(){return `<label class="sr" for="sales-market">Marknad</label><select id="sales-market" onchange="salesSelectMarket(this.value)">${MARKET_PROFILES.map(p=>`<option value="${p.id}" ${p.id===activeMarket?'selected':''}>${p.name}</option>`).join('')}</select>`}
function salesHeader(title,description,action=''){return `<div class="contact-header"><div><div class="eyebrow">Tolkster Motor</div><h1>${title}</h1><p>${description}</p></div><div class="contact-header-actions">${salesMarketSelect()}${action}</div></div><div class="sales-underlay"><button class="table-action" onclick="salesOpenData()">${sales.crm?(sales.crm.example?'Exempel-CRM':sales.crm.contacts.length+' kontakter i Attio-underlaget'):'Läs in Attio-underlag'} →</button><span>${salesStorageError?'Lokal lagring är inte tillgänglig':'Sparas i denna webbläsare'}</span></div>`}
function salesCoverage(){
 const all=sales.roots(activeMarket),rows=all.filter(o=>(salesType==='all'||o.type===salesType||(salesType==='municipality'&&o.type==='municipality_region'))&&(!salesQuery||salesNorm(o.name+' '+o.domain).includes(salesNorm(salesQuery)))).sort((a,b)=>sales.priority(b)-sales.priority(a)||a.name.localeCompare(b.name,'sv'));
 const max=Math.max(0,Math.ceil(rows.length/30)-1);salesPage=Math.min(salesPage,max);const visible=rows.slice(salesPage*30,(salesPage+1)*30);
 const coverage=MASTER_BASELINE.coverage[activeMarket];
 return salesHeader('Marknadstäckning','Se var rätt organisationer och personer saknas.',`<button class="primary" onclick="salesRunPriority()">Starta prioriterat arbete</button>`)+`<div class="sales-filter"><label class="sr" for="sales-search">Sök organisation</label><input id="sales-search" value="${esc(salesQuery)}" placeholder="Sök organisation…" oninput="salesQuery=this.value;salesPage=0;salesRefreshCoverage()"><label class="sr" for="sales-type">Organisationstyp</label><select id="sales-type" onchange="salesType=this.value;salesPage=0;render()">${[['all','Alla organisationer'],['municipality','Kommuner'],['region','Regioner'],['agency','Myndigheter'],['unit','Verksamheter']].map(([k,v])=>`<option value="${k}" ${salesType===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="contact-list-meta"><span>${rows.length} av ${all.length} organisationer · ${motor.market.name}</span><span>${sales.crm?'Gap mot inläst underlag':'Gap kan beräknas när Attio-underlag finns'}</span></div><div class="sales-master-table"><table><thead><tr><th>Organisation</th><th>Potential / vikt</th><th>Täckning</th><th>Nästa steg</th></tr></thead><tbody>${visible.map(o=>{const g=sales.gap(o);return `<tr><td><button class="contact-open" onclick="salesOpenOrg('${o.id}')">${esc(o.name)}</button><small>${o.parentId?'Under '+esc(sales.organisation(o.parentId)?.name||'organisation'):(o.type==='agency'?'Myndighet':o.type.includes('municipality')?'Kommun':'Region')} · ${esc(o.domain||'Domän behöver kartläggas')}</small></td><td>${SALES_LEVELS[o.potential]}<small>Strategisk vikt: ${SALES_IMPORTANCE[o.importance]}</small></td><td>${esc(g.label)}<small>${g.usable.length} personer med namn och mejl i underlaget</small></td><td><button class="table-action" onclick="${!sales.crm?'salesOpenData()':`salesOpenOrg('${o.id}')`}">${esc(g.action)} →</button></td></tr>`}).join('')||'<tr><td colspan="4"><div class="empty">Ingen masterlista för detta urval. Läs in organisationer under Underlag.</div></td></tr>'}</tbody></table></div><div class="sales-paging"><button ${salesPage===0?'disabled':''} onclick="salesPage--;render()">←</button><span>${rows.length?`${salesPage*30+1}–${Math.min(rows.length,(salesPage+1)*30)}`:'0'} av ${rows.length}</span><button ${salesPage>=max?'disabled':''} onclick="salesPage++;render()">→</button></div><p class="simple-footnote">${coverage?esc(coverage.note):'Nationell fullständighet är ännu inte verifierad för denna marknad.'} Källor och kontroller visas per organisation.</p><p class="simple-footnote">Research och fortsatta steg simuleras. Inga externa ändringar eller utskick utförs.</p>`;
}
function salesRefreshCoverage(){const input=$('sales-search'),start=input?.selectionStart;const w=$('workspace');w.innerHTML=salesCoverage();const next=$('sales-search');if(next){next.focus();if(start!==null)next.setSelectionRange(start,start)}}
function salesOpenOrg(id){const o=sales.organisation(id);if(!o)return;const g=sales.gap(o),children=sales.master.filter(x=>x.parentId===id),source=/^https?:\/\//.test(o.source)?`<a href="${esc(o.source)}" target="_blank" rel="noopener">Källa →</a>`:esc(o.source);
 $('record-detail').innerHTML=`<div class="eyebrow">${esc(o.id)}</div><h2>${esc(o.name)}</h2><p>${esc(g.label)}${g.match.org?.owner?' · Ansvarig: '+esc(g.match.org.owner):''}</p><div class="research-grid"><label>Intäktspotential<select id="sales-potential">${Object.entries(SALES_LEVELS).map(([k,v])=>`<option value="${k}" ${o.potential===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Strategisk vikt<select id="sales-importance">${Object.entries(SALES_IMPORTANCE).map(([k,v])=>`<option value="${k}" ${o.importance===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="full">Motivering<input id="sales-basis" value="${esc(o.classificationBasis||'')}" placeholder="Varför bedömer vi potentialen så?"></label></div><button onclick="salesClassify('${id}')">Spara bedömning</button><h3>Luckor att arbeta med</h3><p>${!sales.crm?'Läs in ett aktuellt Attio-underlag för att jämföra.':g.pending?'En namnträff behöver bekräftas innan motorn går vidare.':g.protected?'Följ upp tillsammans med befintlig ansvarig. Ingen ny automatisk bearbetning.':g.missing.map(k=>esc(SALES_ROLES[k])).join(' · ')||'Valda roller täcks i underlaget.'}</p>${g.pending&&g.match.org?`<p>Föreslagen matchning: ${esc(g.match.org.name)}</p><button onclick="salesConfirmOrg('${id}')">Bekräfta denna matchning</button>`:''}<div class="sales-crm-people">${g.contacts.map(c=>`<p><b>${esc(c.name||'Namn saknas')}</b><br>${esc(c.email||'Mejl saknas')}<br>${esc(c.role)}${c.blocked?' · Kontaktspärr':''}</p>`).join('')}</div><h3>Verksamheter</h3>${children.map(c=>`<button class="table-action" onclick="salesOpenOrg('${c.id}')">${esc(c.name)} →</button>`).join('')||'<p>Lokala enheter är ännu inte kartlagda. Lägg till de verksamheter ni vill täcka.</p>'}<div class="dialog-actions"><button onclick="salesAddUnit('${id}')">Lägg till verksamhet</button>${sales.crm&&!g.pending&&!g.protected&&!g.stale?`<button class="primary" onclick="salesRunPriority('${id}')">Sök saknade roller i skissen</button>`:''}<button onclick="this.closest('dialog').close()">Stäng</button></div><p class="simple-policy">${source} · Kontrollerad ${esc(o.checkedAt||'ej angivet')}. Klassningen är Tolksters bedömning, inte verifierad intäkt. ${o.verified?'Organisationen kommer från en offentlig källa.':'Organisationsuppgifterna behöver verifieras.'}</p>`;$('record-dialog').showModal()}
function salesClassify(id){const o=sales.organisation(id);if(!o)return;const basis=$('sales-basis').value.trim();if(!basis){notify('Ange en kort motivering.');return}o.potential=$('sales-potential').value;o.importance=$('sales-importance').value;o.classificationBasis=basis;o.classifiedAt=new Date().toISOString();salesSave();render();salesOpenOrg(id);notify('Bedömningen styr nu researchprioriteten.')}
function salesConfirmOrg(id){const o=sales.organisation(id),g=sales.gap(o);if(g.match.org)sales.confirmed[id]=g.match.org.key;salesIngestCRM();salesSave();render();salesOpenOrg(id)}
function salesAddUnit(parent){$('settings-content').innerHTML=`<h2>Lägg till verksamhet</h2><p>Under ${esc(sales.organisation(parent).name)}.</p><div class="settings-grid"><label>Verksamhetens namn<input id="sales-unit-name" placeholder="Exempelvis ekonomiskt bistånd"></label><label>Källa / underlag<input id="sales-unit-source" placeholder="Webbadress eller intern bekräftelse"></label></div><div class="dialog-actions"><button class="primary" onclick="salesSaveUnit('${parent}')">Lägg till</button></div>`;$('settings-dialog').showModal()}
function salesSaveUnit(parent){const name=$('sales-unit-name').value.trim(),source=$('sales-unit-source').value.trim(),p=sales.organisation(parent);if(!name||!source){notify('Ange verksamhet och källa.');return}const id=parent+'-UNIT-'+salesHash(name);if(sales.organisation(id)){notify('Verksamheten finns redan.');return}sales.master.push({id,name,parentId:parent,market:p.market,type:'unit',domain:p.domain,potential:'unknown',importance:'unknown',source,checkedAt:new Date().toISOString().slice(0,10),aliases:[],verified:false});$('settings-dialog').close();salesSave();render();salesOpenOrg(parent)}
function salesRunPriority(onlyId=null){if(!sales.crm){salesOpenData();notify('Läs in Attio-underlag eller välj exempelläget först.');return}const existing=contactRecords(activeMarket).map(x=>x.r);let jobs;if(onlyId){const others=sales.master.filter(x=>x.market===activeMarket&&x.id!==onlyId);const previous=others.map(o=>o.stopped);others.forEach(o=>o.stopped=true);try{jobs=sales.plan(activeMarket,existing)}finally{others.forEach((o,i)=>{if(previous[i]===undefined)delete o.stopped;else o.stopped=previous[i]})}}else jobs=sales.plan(activeMarket,existing);
 for(const job of jobs){const o=sales.organisation(job.masterId),r=motor.makeRecord(o.name,0,'waiting');r.id=activeMarket+'-'+r.id;r.masterId=o.id;r.role=SALES_ROLES[job.role];r.signal='Gap i Attio-underlaget: '+job.reason;r.origin='Prioriterat exempeluppdrag';r.researchSpec={market:activeMarket,...motor.config,domain:o.parentId?o.name:motor.config.domain};r.customerSegment=o.potential==='large'?'large':o.potential==='small'?'small':'medium';r.exception=o.potential==='unknown'?'Potential behöver bedömas':null;motor.stages[0].records.push(r);fleet.registry.register(motor.market,r);job.contactId=r.contactId;job.status='completed';job.result='Fiktiv kontakt skapad för att prova flödet';}
 if($('record-dialog').open)$('record-dialog').close();motor.running=jobs.length>0||motor.running;salesSave();navigate('overview');notify(jobs.length?jobs.length+' prioriterade exempeluppdrag startade. Mejlen kräver ditt OK.':'Inga nya uppdrag: kontrollera matchningar, spärrar, underlagets ålder eller befintliga uppdrag.')}
function salesOpenData(){$('settings-content').innerHTML=`<h2>Underlag</h2><p>CSV läses lokalt i webbläsaren. Importerade personer läggs inte i webbpaketets filer.</p><div class="settings-grid"><label>Attio-utdrag<input type="file" accept=".csv,text/csv" onchange="salesImport(this,'crm')"></label><label>Masterlista eller verksamheter<input type="file" accept=".csv,text/csv" onchange="salesImport(this,'master')"></label></div><p class="small">${sales.crm?'Senast inläst: '+esc(sales.crm.asOf)+' · '+sales.crm.orgs.length+' organisationer · '+sales.crm.contacts.length+' personer.':'Inget Attio-underlag finns ännu.'}</p><div class="dialog-actions"><button onclick="salesDownloadTemplate('crm')">Mall för Attio-underlag</button><button onclick="salesDownloadTemplate('master')">Mall för masterlista</button><button onclick="salesExport()">Exportera marknadstäckning</button></div><details class="simple-advanced"><summary>Prova och styr motorn</summary><p>Exempelläget skapar ett litet fiktivt CRM-underlag. Det kan bara väljas innan ett eget Attio-underlag lästs in.</p><button onclick="salesDemoCRM()" ${sales.crm&&!sales.crm.example?'disabled':''}>Prova med exempel-CRM</button><div class="settings-grid" style="margin-top:16px"><label>Högst nya kontakter per start<input type="number" min="1" max="10" value="${sales.rules.jobsPerRun}" onchange="sales.rules.jobsPerRun=Math.max(1,Math.min(10,Number(this.value)||3));salesSave()"></label></div><p>Max ${sales.rules.maxAttempts} researchförsök per organisation och roll. Befintliga dialoger, kunder och kontaktspärrar går till ansvarig.</p></details>`;$('settings-dialog').showModal()}
async function salesImport(input,kind){const file=input.files?.[0];if(!file)return;try{const text=await file.text(),count=kind==='crm'?sales.importCRM(text,activeMarket):sales.importMaster(text,activeMarket);if(kind==='crm')salesIngestCRM();salesSave();$('settings-dialog').close();render();notify(count+' rader inlästa. Saknas betyder saknas i detta utdrag, inte säkert i hela Attio.')}catch(e){notify(e.message)}}
function salesIngestCRM(){if(!sales.crm)return;for(const c of sales.crm.contacts){if(!c.email||!c.name)continue;const m=fleet[c.market];if(!m)continue;const org=sales.master.find(o=>{const match=sales.match(o);return o.market===c.market&&['exact','confirmed'].includes(match.kind)&&match.org.key===c.orgKey&&(!o.parentId||c.masterId===o.id||salesNorm(c.department)===salesNorm(o.name))});if(!org)continue;let existing=contactRecords().find(x=>x.r.email?.toLowerCase()===c.email.toLowerCase())?.r;if(!existing){const r=m.makeRecord(org.name,1,'review');Object.assign(r,{id:c.market+'-CSV-'+r.id,masterId:org.id,contactName:c.name,email:c.email,role:c.role||'Roll behöver bekräftas',isExample:!!sales.crm.example,emailVerified:false,attioRecordId:c.recordId||'',exception:'Befintlig kontakt – granska dialog och ansvarig',origin:sales.crm.example?'Exempel-CRM':'Inläst Attio-underlag',researchSpec:{market:c.market,...m.config}});m.stages[1].records.push(r);fleet.registry.register(m.market,r);existing=r;}if(c.blocked)fleet.registry.set(existing,'contact','blocked','Kontaktspärr i Attio-underlaget');const account=sales.crm.orgs.find(o=>o.key===c.orgKey);if(account?.blocked)fleet.registry.set(existing,'organisation','blocked','Organisationsspärr i Attio-underlaget');else if(c.active||c.customer||account?.active||account?.customer)fleet.registry.set(existing,'opportunity','paused','Befintlig relation – hanteras med ansvarig');}fleet.registry.sync(fleet)}
function salesDemoCRM(){if(sales.crm&&!sales.crm.example){notify('Eget Attio-underlag finns. Exempelläget ersätter det inte.');return}const orgs=sales.roots(activeMarket).filter(o=>!o.parentId).slice(0,3);if(!orgs.length){notify('Läs in en masterlista för marknaden först.');return}sales.crm={example:true,asOf:new Date().toISOString(),orgs:orgs.map((o,i)=>({key:o.id,masterId:o.id,name:o.name,domain:o.domain,market:o.market,owner:'Exempelansvarig',active:i===2})),contacts:orgs.slice(0,2).map((o,i)=>({...exampleContact(o.name,90+i),key:'email:'+exampleContact(o.name,90+i).email,name:exampleContact(o.name,90+i).contactName,role:'Verksamhetschef',roleKey:'business',orgKey:o.id,market:o.market,recordId:'SIM-'+i}))};salesIngestCRM();salesSave();$('settings-dialog').close();render();notify('Exempel-CRM inläst. Nu går det att prova gap och prioriterat arbete.')}
function salesDownload(name,text){const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function salesDownloadTemplate(kind){salesDownload(kind==='crm'?'attio-underlag-mall.csv':'masterlista-mall.csv',kind==='crm'?'record_type,record_id,master_id,market,name,email,job_title,company,domain,department,owner,active_dialog,is_customer,do_not_contact\nperson,SIM-1,SE-KOM-0186,SE,Anna Exempel,anna@exempel.example,Verksamhetschef,Lidingö stad,lidingo.se,,Henrik,false,false,false\n':'master_id,name,market,type,parent_id,domain,potential,importance,source,classification_basis\nSE-UNIT-EXEMPEL,Ekonomiskt bistånd,SE,unit,SE-KOM-0186,lidingo.se,unknown,unknown,Intern bekräftelse,Ej bedömd\n')}
function salesExport(){const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t]/,"'$&").replace(/"/g,'""')+'"';const rows=[['master_id','organisation','land','potential','strategisk_vikt','attio_täckning','saknade_roller','källa'],...sales.roots(activeMarket).map(o=>[o.id,o.name,o.market,SALES_LEVELS[o.potential],SALES_IMPORTANCE[o.importance],sales.gap(o).label,sales.gap(o).missing.map(k=>SALES_ROLES[k]).join('; '),o.source])];salesDownload('marknadstackning-'+activeMarket+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\n'))}
function salesMail(code,i,id){activeMarket=code;motor=fleet[code];const r=motor.stages[i]?.records.find(x=>x.id===id);if(!r)return;const draft=sales.draft(r,demoHref(r));salesMailTarget={code,i,id};$('settings-content').innerHTML=`<div class="eyebrow">Mejlutkast · ${esc(r.email)}</div><h2>Till ${esc(contactLabel(r))}</h2><p>Granska och godkänn. Denna version simulerar utskicket.</p><div class="settings-grid"><label>Ämne<input id="sales-mail-subject" value="${esc(draft.subject)}"></label><label>Meddelande<textarea id="sales-mail-body" rows="13">${esc(draft.body)}</textarea></label></div><div class="dialog-actions"><button class="primary" onclick="salesApproveMail()">Godkänn och simulera utskick</button><button onclick="this.closest('dialog').close()">Avbryt</button></div>`;$('settings-dialog').showModal()}
function salesApproveMail(){if(!salesMailTarget)return;const {code,i,id}=salesMailTarget,m=fleet[code],r=m.stages[i].records.find(x=>x.id===id);if(!r)return;if(!fleet.registry.decision(r).allowed){notify('Kontakten är stoppad.');return}try{sales.approveDraft(r,$('sales-mail-subject').value,$('sales-mail-body').value);activeMarket=code;motor=m;const result=m.handoff(i,[id],i+1,true);if(!result.sent)throw Error('Kontakten kunde inte gå vidare.');sales.event(r,'mail.sent');$('settings-dialog').close();if($('record-dialog').open)$('record-dialog').close();salesSave();render();notify('Godkänt utskick simulerat. Inget mejl har skickats.')}catch(e){notify(e.message)}}
const salesContactDetail=contactDetail;
contactDetail=function(i,r,extra=null){salesContactDetail(i,r,extra);const detail=$('record-detail');if(i===2&&['ready','review'].includes(r.status)&&fleet.registry.decision(r).allowed){const button=detail.querySelector('.dialog-actions .primary');if(button){button.textContent='Granska personligt mejl →';button.setAttribute('onclick',`salesMail('${motor.market.id}',${i},'${r.id}')`)}}if(!r.isExample){const eyebrow=detail.querySelector('.eyebrow');if(eyebrow)eyebrow.textContent=motor.market.name+' · kontakt från Attio-underlag'}const events=sales.events.filter(e=>e.contactId===contactKey(r));detail.insertAdjacentHTML('beforeend',`<section class="record-context"><h3>Kontaktens händelser</h3>${events.map(e=>`<p>${esc(new Date(e.at).toLocaleString('sv-SE'))} · ${esc(({'mail.sent':'Mejl skickat – simulering','reply.received':'Svar – simulering','link.used':'Länken använd – simulering','demo.opened':'Demo öppnad','human.requested':'Personlig kontakt – simulering'}[e.type])||e.type)}<br><small>${e.verified?'Verifierad identitet':'Identiteten är inte verifierad'}</small></p>`).join('')||'<p>Inga spårningshändelser ännu.</p>'}<details class="simple-advanced"><summary>Prova spårning</summary><div class="simple-agent-links">${[['link.used','Länken används'],['demo.opened','Demo öppnas'],['reply.received','Svar kommer'],['human.requested','Vill prata med Henrik']].map(([key,label])=>`<button onclick="salesSimulateEvent('${motor.market.id}',${i},'${r.id}','${key}')">${label}</button>`).join('')}</div></details><p class="simple-policy">Ett klick eller en öppnad länk identifierar inte säkert besökaren. Spårningen här är lokal; webbplatsens riktiga mätning och verifierad Demo-inloggning behöver anslutas.</p></section>`)};
function salesSimulateEvent(code,i,id,type){const m=fleet[code],r=i===4?m.delivered.find(x=>x.id===id):m.stages[i].records.find(x=>x.id===id);if(!r)return;sales.event(r,type);salesSave();$('record-dialog').close();contactOpen(code,i,id)}
const salesContactHome=renderMarketHome;
renderMarketHome=function(){return salesContactHome().replace('<p>Hitta rätt person. Följ kontakten hela vägen till Demo.</p>','<p>Hittad → Attio → godkänt mejl → personlig Demo.</p>')+`<p><button class="table-action" onclick="salesOpenData()">Underlag och import →</button></p>`};
const salesBaseRender=render;
function salesReadDemoEvents(){try{const events=JSON.parse(localStorage.getItem('tolkster.motor.demo-events.v1')||'[]'),known=new Set(contactRecords().map(x=>contactKey(x.r)));if(Array.isArray(events))for(const e of events)if(e.type==='demo.opened'&&known.has(e.contactId)&&!sales.events.some(old=>old.id===e.id))sales.events.push({id:String(e.id),contactId:e.contactId,type:'demo.opened',at:String(e.at),example:true,verified:false,source:'browser'})}catch{}}
render=function(){salesReadDemoEvents();if(view==='coverage'){renderNav();$('workspace').innerHTML=salesCoverage();renderSide()}else salesBaseRender();salesSave()};
const salesBaseNav=renderNav;
renderNav=function(){salesBaseNav();const nav=$('navigation');nav.insertAdjacentHTML('afterbegin',`<button class="nav-item ${view==='coverage'?'active':''}" onclick="navigate('coverage')">Marknadstäckning</button>`);document.querySelector('.mobile-nav').insertAdjacentHTML('afterbegin',`<option value="coverage" ${view==='coverage'?'selected':''}>Marknadstäckning</option>`)};
salesRestore();view='coverage';render();
window.addEventListener('storage',e=>{if(e.key==='tolkster.motor.demo-events.v1'){salesReadDemoEvents();salesSave();if(!$('record-dialog').open)render()}});

</script></body></html>
